schema_version: 1

context:
  name: lazy-property
  version: "0.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 3a1cd36949b323468731ba569e169415a609d5904d53fffe982055fbe67b1180

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lazy_property
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: A package for making properties lazy
  description: |
    Properties are a very useful feature of Python, effectively allowing
    an attribute to masquerade as a method (with no arguments other than
    self). However, sometimes we want to store the results of an expensive
    computation in an attribute.
  homepage: https://github.com/jackmaney/lazy-property
  repository: https://github.com/jackmaney/lazy-property
  documentation: https://github.com/jackmaney/lazy-property

extra:
  recipe-maintainers:
    - jan-janssen
